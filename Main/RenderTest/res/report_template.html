<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Render Test Report</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0c1118;
  --surface: #121a24;
  --surface2: #172231;
  --border: #2b3a4f;
  --text: #eaf2ff;
  --muted: #9fb0ca;
  --ok: #39d98a;
  --bad: #ff6b7a;
  --accent: #6ba3ff;
  --warn: #ffc077;
  --focus: 0 0 0 2px rgba(107, 163, 255, 0.35);
}
* { box-sizing: border-box; }
body { margin: 0; background: radial-gradient(1400px 500px at 12% -20%, #22304666, transparent 60%), var(--bg); color: var(--text); font: 14px/1.4 "Segoe UI Variable","Segoe UI",system-ui,Arial,sans-serif; overflow-y: auto; }
.app { display: grid; grid-template-columns: 320px 1fr; min-height: 100dvh; }
aside { border-right: 1px solid var(--border); padding: 14px; position: sticky; top: 0; align-self: start; max-height: 100dvh; overflow: auto; background: linear-gradient(180deg, #111b28 0%, #0f1620 100%); }
main { padding: 18px; min-width: 0; }
h1,h2,h3 { margin: 0; font-weight: 650; }
.meta { margin-top: 10px; color: var(--muted); font-size: 12px; }
.cards { margin-top: 14px; display: grid; gap: 8px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px; }
.label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
.value { font-size: 18px; margin-top: 2px; }
.ok { color: var(--ok); }
.bad { color: var(--bad); }
.toolrow { margin-top: 12px; display: grid; gap: 8px; }
input,select { width: 100%; border: 1px solid var(--border); background: var(--surface2); color: var(--text); border-radius: 8px; padding: 9px 10px; }
.list { margin-top: 12px; display: grid; gap: 8px; }
.item { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 8px; cursor: pointer; }
.item:hover { border-color: var(--accent); }
.item .name { font-weight: 600; }
.item .tiny { color: var(--muted); font-size: 12px; margin-top: 4px; }
.panel {
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: 8px;
  margin-bottom: 14px;
  min-height: calc(100dvh - 36px);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.panel-h {
  padding: 12px;
  border-bottom: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 8px;
  position: sticky;
  top: 0;
  z-index: 5;
  background: var(--surface);
}
.desc { color: var(--muted); margin-top: 8px; white-space: pre-wrap; }
.case {
  border-top: 1px solid var(--border);
  padding: 12px;
  overflow: visible;
  min-height: 0;
  flex: 1;
}
.case:first-of-type { border-top: 0; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row-space {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px;
  align-items: start;
}
.badge { border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px; font-size: 12px; }
.images { margin-top: 10px; display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
.imgbox { background: #0a0f16; border: 1px solid var(--border); border-radius: 8px; padding: 8px; min-height: 120px; }
.imgbox img { display: block; border-radius: 6px; }
.images.plot-grid { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
.images.plot-grid .imgbox {
  width: 320px;
  height: auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
}
.images.plot-grid .imgframe {
  width: 100%;
  height: var(--plot-item-height, 220px);
  display: flex;
  align-items: center;
  justify-content: center;
  background: #000;
  overflow: hidden;
}
.images.plot-grid .imgframe img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.imglabel { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.compare { margin-top: 10px; }
.compare-stage {
  border: 1px solid var(--border);
  border-radius: 0;
  overflow: hidden;
  background: #000;
  width: var(--compare-full-width, 100%);
  height: var(--compare-full-height, 100%);
}
.compare-stage img-comparison-slider {
  width: 100%;
  height: 100%;
  display: block;
  --divider-width: 2px;
  --divider-color: rgba(255, 255, 255, 0.98);
  --divider-shadow: 0 0 0 1px rgba(0, 0, 0, 0.98), 0 0 0 2px rgba(255, 255, 255, 0.98), 0 0 10px rgba(0, 0, 0, 0.45);
  --default-handle-width: 44px;
  --default-handle-color: rgba(255, 255, 255, 0.98);
  --default-handle-opacity: 1;
  --default-handle-shadow: 0 0 0 2px rgba(255, 255, 255, 0.95), 0 0 0 4px rgba(0, 0, 0, 0.95), 0 4px 14px rgba(0, 0, 0, 0.55);
}
.compare-handle {
  width: 36px;
  height: 52px;
  border-radius: 999px;
  border: 1px solid rgba(0, 0, 0, 0.96);
  background: rgba(255, 255, 255, 0.98);
  box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.95), 0 0 0 4px rgba(0, 0, 0, 0.95), 0 4px 14px rgba(0, 0, 0, 0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.compare-handle .chev {
  width: 0;
  height: 0;
  border-top: 6px solid transparent;
  border-bottom: 6px solid transparent;
}
.compare-handle .chev.left { border-right: 7px solid #0a0f16; }
.compare-handle .chev.right { border-left: 7px solid #0a0f16; }
.compare-handle .bar {
  width: 1px;
  height: 26px;
  background: rgba(10, 15, 22, 0.96);
}
.selector-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  column-gap: 8px;
  width: 100%;
}
.selector-row select { width: 100%; min-width: 0; margin: 0; }
.selector-lines { display: grid; gap: 8px; width: min(860px, 100%); }
.btn-group {
  display: inline-flex;
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  background: var(--surface2);
}
.btn {
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--text);
  border-radius: 8px;
  padding: 6px 10px;
  cursor: pointer;
}
.btn:hover { border-color: var(--accent); background: #213046; }
.btn:active { background: #2b3e5a; }
.btn:focus-visible { outline: none; box-shadow: var(--focus); }
.btn[disabled] {
  opacity: 0.45;
  cursor: default;
}
.btn.active {
  border-color: var(--accent);
  background: #244066;
}
.btn-warn.active {
  border-color: #d9a66b;
  background: #4a3722;
  color: #ffe7c7;
}
.btn-group > .btn {
  border: 0;
  border-right: 1px solid var(--border);
  border-radius: 0;
}
.btn-group > .btn:last-child { border-right: 0; }
.btn-icon {
  width: 34px;
  height: 34px;
  padding: 0;
  font-size: 16px;
  line-height: 1;
}
.btn-group-wrap { display: inline-flex; gap: 8px; flex-wrap: wrap; }
@media (max-width: 900px) {
  .row-space { grid-template-columns: 1fr; }
  .selector-lines { width: 100%; }
}
.compare-stage img,
.compare-stage canvas {
  width: var(--compare-full-width, 100%);
  height: var(--compare-full-height, 100%);
  max-width: none;
  max-height: none;
  display: block;
  object-fit: contain;
  background: #000;
}
.compare-stage canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
.msg { margin-top: 8px; color: var(--muted); white-space: pre-wrap; }
.controls-col { display: grid; gap: 6px; }
.meta-toggle-row { display: flex; align-items: center; gap: 8px; }
.text-expander {
  border: 1px solid var(--border);
  background: var(--surface2);
  border-radius: 8px;
}
.text-expander > summary {
  list-style: none;
  cursor: pointer;
  padding: 6px 10px;
}
.text-expander > summary::-webkit-details-marker { display: none; }
.text-expander-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.text-expander-preview {
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}
.text-expander-arrow {
  color: var(--muted);
  font-size: 12px;
  line-height: 1;
  flex: 0 0 auto;
  transition: transform .12s ease;
}
.text-expander-body {
  margin: 0;
  padding: 0 10px 8px 10px;
  color: var(--muted);
  white-space: pre-wrap;
}
.text-expander:not([open]) .text-expander-body { display: none; }
.text-expander[open] .text-expander-arrow { transform: rotate(90deg); }
.verifier-row { display: flex; gap: 8px; flex-wrap: wrap; }
.viewmode-row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-small { font-size: 12px; padding: 5px 10px; }
.scale-select { width: auto; min-width: 96px; }
.scale-label { font-size: 12px; color: var(--muted); align-self: center; }
.sys { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 10px; font-size: 12px; color: var(--muted); }
.warns { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 10px; font-size: 12px; color: var(--warn); white-space: pre-wrap; display: none; }
.warns.show { display: block; }
small.kbd-hint { display: block; margin-top: 8px; color: var(--muted); }
@media (max-width: 1100px) {
  .app { grid-template-columns: 1fr; }
  aside { position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--border); }
  .panel { min-height: 0; }
  .case { overflow: visible; }
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>Render Test Report</h1>
    <div class="meta" id="genTime"></div>
    <div class="cards">
      <div class="card"><div class="label">Cases</div><div class="value" id="totalCases"></div></div>
      <div class="card"><div class="label">Pass Rate</div><div class="value" id="passRate"></div></div>
      <div class="card"><div class="label">Passed</div><div class="value ok" id="passedCases"></div></div>
      <div class="card"><div class="label">Failed</div><div class="value bad" id="failedCases"></div></div>
      <div class="card"><div class="label">Warnings</div><div class="value" id="warningCount"></div></div>
    </div>
    <div class="toolrow">
      <input id="search" type="search" placeholder="Search test/case name..." />
      <select id="filter">
        <option value="all">All outcomes</option>
        <option value="failed">Failed only</option>
        <option value="passed">Passed only</option>
      </select>
    </div>
    <div class="meta" id="listSummary"></div>
    <div class="list" id="testList"></div>
    <div class="sys" id="sysInfo"></div>
    <button class="btn" id="toggleWarningsBtn" type="button">Show Warnings</button>
    <div class="warns" id="warnInfo"></div>
    <small class="kbd-hint">Shortcuts: `/` search, `j/k` cases, `J/K` suites, `f` failed filter</small>
  </aside>
  <main id="content"></main>
</div>
<script src="vendor/img-comparison-slider.js"></script>
<script>
const data = __PAYLOAD_JSON__;
const qs = (s, p=document) => p.querySelector(s);
const qsa = (s, p=document) => Array.from(p.querySelectorAll(s));
const escapeHtml = (v) => String(v ?? "").replace(/[&<>"']/g, (ch) => ({
  "&": "&amp;",
  "<": "&lt;",
  ">": "&gt;",
  "\"": "&quot;",
  "'": "&#39;"
}[ch]));
const escapeAttr = escapeHtml;
const toText = (v) => String(v ?? "");
const hasImg = (v) => typeof v === "string" && v.length > 0;
const appState = {
  testName: "",
  caseName: "",
  modeIndex: 0,
  verifierName: "",
  viewMode: "compare",
  scaleSetting: "fit",
  searchText: "",
  outcomeFilter: "all",
  warningsOpen: false
};
let suppressHashSync = false;
let fitResizeTimer = 0;

function findTestByName(name) {
  return data.tests.find((t) => t.name === name) || null;
}

function readStateFromHash() {
  const raw = String(window.location.hash || "").replace(/^#/, "");
  if (!raw) return;
  const params = new URLSearchParams(raw);
  appState.testName = params.get("test") || appState.testName;
  appState.caseName = params.get("case") || appState.caseName;
  appState.modeIndex = Math.max(0, Number.parseInt(params.get("mode") || "0", 10) || 0);
  appState.verifierName = params.get("verifier") || appState.verifierName;
  const view = params.get("view");
  appState.viewMode = view === "plot" ? "plot" : "compare";
  const scale = params.get("scale");
  appState.scaleSetting = scale === "fit" ? "fit" : (["50", "100", "200", "400"].includes(scale) ? scale : appState.scaleSetting);
  appState.searchText = params.get("q") || appState.searchText;
  const filter = params.get("filter");
  appState.outcomeFilter = ["all", "failed", "passed"].includes(filter) ? filter : appState.outcomeFilter;
  appState.warningsOpen = params.get("warn") === "1";
}

function syncStateToHash() {
  if (suppressHashSync) return;
  const params = new URLSearchParams();
  if (appState.testName) params.set("test", appState.testName);
  if (appState.caseName) params.set("case", appState.caseName);
  if (appState.modeIndex > 0) params.set("mode", String(appState.modeIndex));
  if (appState.verifierName) params.set("verifier", appState.verifierName);
  if (appState.viewMode !== "compare") params.set("view", appState.viewMode);
  if (appState.scaleSetting !== "fit") params.set("scale", appState.scaleSetting);
  if (appState.searchText) params.set("q", appState.searchText);
  if (appState.outcomeFilter !== "all") params.set("filter", appState.outcomeFilter);
  if (appState.warningsOpen) params.set("warn", "1");
  const nextHash = params.toString();
  try {
    suppressHashSync = true;
    const nextUrl = `${window.location.pathname}${window.location.search}${nextHash ? `#${nextHash}` : ""}`;
    window.history.replaceState(null, "", nextUrl);
  } catch (_) {
    window.location.hash = nextHash;
  } finally {
    suppressHashSync = false;
  }
}

function setTextMessage(parent, text) {
  parent.textContent = "";
  const node = document.createElement("div");
  node.className = "msg";
  node.textContent = text;
  parent.appendChild(node);
}

function parsePfm(arrayBuffer) {
  const bytes = new Uint8Array(arrayBuffer);
  let offset = 0;
  const readLineRaw = () => {
    if (offset >= bytes.length) throw new Error("unexpected EOF");
    let end = offset;
    while (end < bytes.length && bytes[end] !== 0x0a) end += 1;
    const line = new TextDecoder("ascii").decode(bytes.slice(offset, end)).trim();
    offset = end < bytes.length ? end + 1 : end;
    return line;
  };
  const readHeaderLine = () => {
    for (;;) {
      const line = readLineRaw();
      if (!line || line.startsWith("#")) continue;
      return line;
    }
  };

  const magic = readHeaderLine();
  const channels = magic === "PF" ? 3 : (magic === "Pf" ? 1 : 0);
  if (!channels) throw new Error(`unsupported PFM magic: ${magic}`);

  const [wStr, hStr] = readHeaderLine().split(/\s+/);
  const width = Number(wStr);
  const height = Number(hStr);
  if (!Number.isInteger(width) || !Number.isInteger(height) || width <= 0 || height <= 0) throw new Error("bad PFM dimensions");

  const scale = Number(readHeaderLine());
  if (!Number.isFinite(scale) || scale === 0) throw new Error("bad PFM scale");
  const littleEndian = scale < 0;
  const absScale = Math.abs(scale);

  const floatCount = width * height * channels;
  if (!Number.isSafeInteger(floatCount) || floatCount <= 0) throw new Error("PFM size overflow");
  const expectedBytes = floatCount * 4;
  if (offset + expectedBytes > arrayBuffer.byteLength) throw new Error("PFM data truncated");
  const view = new DataView(arrayBuffer, offset, expectedBytes);
  const values = new Float32Array(floatCount);
  for (let i = 0; i < floatCount; ++i) {
    values[i] = view.getFloat32(i * 4, littleEndian) * absScale;
  }
  return { width, height, channels, values };
}

function calcDisplayMax(pfmA, pfmB) {
  let maxVal = 0;
  const scan = (arr) => {
    for (let i = 0; i < arr.length; ++i) {
      const v = arr[i];
      if (Number.isFinite(v) && v > maxVal) maxVal = v;
    }
  };
  scan(pfmA.values);
  scan(pfmB.values);
  return maxVal > 0 ? maxVal : 1.0;
}

function drawPfmToCanvas(canvas, pfm, displayMax) {
  canvas.width = pfm.width;
  canvas.height = pfm.height;
  const ctx = canvas.getContext("2d");
  const imageData = ctx.createImageData(pfm.width, pfm.height);
  const out = imageData.data;
  const gamma = 1.0 / 2.2;

  for (let y = 0; y < pfm.height; ++y) {
    for (let x = 0; x < pfm.width; ++x) {
      const srcY = pfm.height - 1 - y;
      const srcIndex = (srcY * pfm.width + x) * pfm.channels;
      const dstIndex = (y * pfm.width + x) * 4;
      const r = pfm.values[srcIndex];
      const g = pfm.channels > 1 ? pfm.values[srcIndex + 1] : r;
      const b = pfm.channels > 1 ? pfm.values[srcIndex + 2] : r;
      const map = (v) => {
        const n = Math.max(0, Math.min(1, v / displayMax));
        return Math.round(Math.pow(n, gamma) * 255);
      };
      out[dstIndex] = map(r);
      out[dstIndex + 1] = map(g);
      out[dstIndex + 2] = map(b);
      out[dstIndex + 3] = 255;
    }
  }
  ctx.putImageData(imageData, 0, 0);
}

function setCompareScale(compareRoot, scalePercent) {
  const stage = qs(".compare-stage", compareRoot);
  if (!stage) return null;
  const baseCanvas = qs(".pfm-base", compareRoot);
  const baseImg = qs(".compare-base-media", compareRoot);
  let nativeWidth = 0;
  let nativeHeight = 0;
  if (baseCanvas) {
    nativeWidth = baseCanvas.width;
    nativeHeight = baseCanvas.height;
  } else if (baseImg) {
    nativeWidth = baseImg.naturalWidth;
    nativeHeight = baseImg.naturalHeight;
  }
  if (!nativeWidth || !nativeHeight) return;
  if (nativeWidth < 64 || nativeHeight < 64) {
    // Some cases may produce very small buffers; keep viewer usable.
    nativeWidth = Math.max(nativeWidth, 64);
    nativeHeight = Math.max(nativeHeight, 64);
  }

  const clamped = Math.max(5, Math.min(1600, Number(scalePercent) || 100));
  const targetWidth = Math.max(1, Math.round(nativeWidth * clamped / 100));
  const targetHeight = Math.max(1, Math.round(nativeHeight * clamped / 100));
  stage.style.width = `${targetWidth}px`;
  stage.style.height = `${targetHeight}px`;
  compareRoot.style.setProperty("--compare-full-width", `${targetWidth}px`);
  compareRoot.style.setProperty("--compare-full-height", `${targetHeight}px`);
  return { percent: clamped, width: targetWidth, height: targetHeight };
}

function calcFitScalePercent(compareRoot) {
  const baseCanvas = qs(".pfm-base", compareRoot);
  const baseImg = qs(".compare-base-media", compareRoot);
  let nativeWidth = 0;
  let nativeHeight = 0;
  if (baseCanvas) {
    nativeWidth = baseCanvas.width;
    nativeHeight = baseCanvas.height;
  } else if (baseImg) {
    nativeWidth = baseImg.naturalWidth;
    nativeHeight = baseImg.naturalHeight;
  }
  if (!nativeWidth || !nativeHeight) return 100;
  if (nativeWidth < 64 || nativeHeight < 64) {
    nativeWidth = Math.max(nativeWidth, 64);
    nativeHeight = Math.max(nativeHeight, 64);
  }

  const stage = qs(".compare-stage", compareRoot);
  if (!stage) return 100;

  const rootRect = compareRoot.getBoundingClientRect();

  // Width budget: keep within the compare block content width.
  const maxW = Math.max(80, compareRoot.clientWidth - 4);

  // Height budget: use remaining viewport height after this compare block's top,
  // minus non-image controls inside the compare block.
  let nonImageHeight = 0;
  const children = Array.from(compareRoot.children);
  for (const child of children) {
    if (child === stage) continue;
    const style = window.getComputedStyle(child);
    const mt = parseFloat(style.marginTop) || 0;
    const mb = parseFloat(style.marginBottom) || 0;
    nonImageHeight += child.getBoundingClientRect().height + mt + mb;
  }
  const viewportBottomPadding = 20;
  const remainingH = window.innerHeight - rootRect.top - viewportBottomPadding;
  const maxH = Math.max(80, remainingH - nonImageHeight);

  const fit = Math.min(maxW / nativeWidth, maxH / nativeHeight);
  return Math.max(5, Math.floor(fit * 100));
}

function applyCompareScale(compareRoot, setting) {
  if (setting === "fit") {
    return setCompareScale(compareRoot, calcFitScalePercent(compareRoot));
  }
  return setCompareScale(compareRoot, Number(setting));
}

function applyPlotScale(modeContent, setting) {
  const plotRoot = qs(".images.plot-grid", modeContent);
  if (!plotRoot) return null;
  const boxes = qsa(".imgbox", plotRoot);
  const imgs = qsa(".imgbox img", plotRoot).filter((img) => (img.naturalWidth > 0 && img.naturalHeight > 0));
  if (!boxes.length || !imgs.length) return null;
  const firstBox = boxes[0];
  const label = qs(".imglabel", firstBox);
  const boxStyle = window.getComputedStyle(firstBox);
  const padTop = parseFloat(boxStyle.paddingTop) || 0;
  const padBottom = parseFloat(boxStyle.paddingBottom) || 0;
  const padLeft = parseFloat(boxStyle.paddingLeft) || 0;
  const padRight = parseFloat(boxStyle.paddingRight) || 0;
  const borderY = (parseFloat(boxStyle.borderTopWidth) || 0) + (parseFloat(boxStyle.borderBottomWidth) || 0);
  const borderX = (parseFloat(boxStyle.borderLeftWidth) || 0) + (parseFloat(boxStyle.borderRightWidth) || 0);
  const labelH = label ? label.getBoundingClientRect().height + (parseFloat(window.getComputedStyle(label).marginBottom) || 0) : 0;
  const chromeW = padLeft + padRight + borderX;

  // Plot mode no longer auto-fits. "Fit" maps to 100%.
  const percent = setting === "fit" ? 100 : Math.max(5, Math.min(1600, Number(setting) || 100));
  const targetPlotH = Math.max(1, Math.round(imgs[0].naturalHeight * percent / 100));
  plotRoot.style.setProperty("--plot-item-height", `${targetPlotH}px`);

  for (const box of boxes) {
    const img = qs("img", box);
    if (!img || img.naturalWidth <= 0 || img.naturalHeight <= 0) {
      box.style.width = "320px";
      continue;
    }
    const aspect = img.naturalWidth / img.naturalHeight;
    const targetW = Math.max(40, Math.round(targetPlotH * aspect) + Math.round(chromeW));
    box.style.width = `${targetW}px`;
  }
  return percent;
}

function updateScaleLabel(percent) {
  const label = qs("#scalePct");
  if (label && percent != null) label.textContent = `${Math.round(percent)}%`;
}

function applyScaleForCurrentMode(caseEl, modeContent, viewMode) {
  const setting = caseEl.dataset.scaleSetting || appState.scaleSetting || "fit";
  let percent = null;
  if (viewMode === "plot") {
    percent = applyPlotScale(modeContent, setting);
  } else {
    const compareRoot = qs(".compare", modeContent);
    if (compareRoot) {
      const result = applyCompareScale(compareRoot, setting);
      if (result) percent = result.percent;
    }
  }
  updateScaleLabel(percent);
}

async function initPfmCompare(block, outputPfmPath, refPfmPath) {
  if (!outputPfmPath || !refPfmPath) return;
  try {
    const loadArrayBuffer = async (rawPath) => {
      const normalizedPath = encodeURI(rawPath);
      try {
        const resp = await fetch(normalizedPath);
        if (!resp.ok) throw new Error(`fetch failed (${resp.status})`);
        return await resp.arrayBuffer();
      } catch (fetchError) {
        return await new Promise((resolve, reject) => {
          const req = new XMLHttpRequest();
          req.open("GET", normalizedPath, true);
          req.responseType = "arraybuffer";
          req.onload = () => {
            if (req.status === 0 || (req.status >= 200 && req.status < 300)) {
              resolve(req.response);
            } else {
              reject(new Error(`xhr failed (${req.status})`));
            }
          };
          req.onerror = () => reject(fetchError);
          req.send();
        });
      }
    };

    const outputPfm = parsePfm(await loadArrayBuffer(outputPfmPath));
    const refPfm = parsePfm(await loadArrayBuffer(refPfmPath));
    const displayMax = calcDisplayMax(outputPfm, refPfm);
    drawPfmToCanvas(qs(".pfm-base", block), refPfm, displayMax);
    drawPfmToCanvas(qs(".pfm-overlay", block), outputPfm, displayMax);
    return true;
  } catch (error) {
    const protocol = String(window.location.protocol || "");
    if (protocol === "file:") {
      setTextMessage(block, "(raw compare blocked by browser local-file security; open report via localhost/http to enable raw PFM compare)");
    } else {
      setTextMessage(block, `(raw compare load failed: ${toText(error.message || error)})`);
    }
    return false;
  }
}

function updateWarningsButtonText() {
  const count = (data.warnings || []).length;
  const visible = qs("#warnInfo").classList.contains("show");
  qs("#toggleWarningsBtn").textContent = visible ? `Hide Warnings (${count})` : `Show Warnings (${count})`;
}

function renderSummary() {
  const s = data.summary;
  qs("#genTime").textContent = `UTC ${toText(s.generation_time_utc)} | ${Math.round(s.total_secs)}s total`;
  qs("#totalCases").textContent = toText(s.total_cases);
  qs("#passRate").textContent = `${s.pass_ratio.toFixed(2)}%`;
  qs("#passedCases").textContent = toText(s.passed_cases);
  qs("#failedCases").textContent = toText(s.failed_cases);
  const warns = data.warnings || [];
  qs("#warningCount").textContent = toText(warns.length);
  const sys = s.system;
  const sysInfo = qs("#sysInfo");
  sysInfo.textContent = "";
  const sysLines = [
    `OS: ${toText(sys.os)}`,
    `CPU: ${toText(sys.cpu)} (${toText(sys.cpu_logical)} logical/${toText(sys.cpu_physical)} physical)`,
    `RAM: ${sys.ram_gib.toFixed(2)} GiB`,
    `Disk: ${sys.disk_total_gib.toFixed(2)} GiB total, ${sys.disk_free_gib.toFixed(2)} GiB free`
  ];
  for (const line of sysLines) {
    const div = document.createElement("div");
    div.textContent = line;
    sysInfo.appendChild(div);
  }

  warnInfo.textContent = warns.length
    ? warns.map((w) => `- ${w.nodeid}: ${w.message}`).join("\n")
    : "No warnings.";
  if (warns.length > 0 && data.summary.failed_cases > 0) {
    warnInfo.classList.add("show");
    appState.warningsOpen = true;
  }
  updateWarningsButtonText();

function selectedTest() {
  return findTestByName(appState.testName) || data.tests[0] || null;
}

function selectedCase(test) {
  return (test.cases || []).find((c) => c.name === appState.caseName) || test.cases[0] || null;
}

function renderCaseSelector(test) {
  const caseSel = qs("#caseSelect");
  caseSel.innerHTML = "";
  for (const c of test.cases) {
    const opt = document.createElement("option");
    opt.value = c.name;
    opt.textContent = `${c.name} [${c.outcome.toUpperCase()}]`;
    caseSel.appendChild(opt);
  }
}

function findPreferredVerifierIndex(modes, prevVerifierName) {
  let preferredIndex = modes.findIndex((v) => v.verifier === prevVerifierName);
  if (preferredIndex < 0) {
    preferredIndex = modes.findIndex((v) => {
      const name = String(v.verifier || "");
      return name.includes("VisualErrorVerifier") || name.includes("Visual");
    });
  }
  return preferredIndex < 0 ? 0 : preferredIndex;
}

function buildViewModeControls(viewMode, scaleSetting) {
  return `
      <div class="btn-group">
        <button class="btn btn-small btn-warn viewmode-btn ${viewMode === "compare" ? "active" : ""}" type="button" data-viewmode="compare">Slider Compare</button>
        <button class="btn btn-small btn-warn viewmode-btn ${viewMode === "plot" ? "active" : ""}" type="button" data-viewmode="plot">Verifier Plots</button>
      </div>
      <select class="scale-select" id="scaleSelect">
        <option value="fit" ${scaleSetting === "fit" ? "selected" : ""}>Fit</option>
        <option value="50" ${scaleSetting === "50" ? "selected" : ""}>50%</option>
        <option value="100" ${scaleSetting === "100" ? "selected" : ""}>100%</option>
        <option value="200" ${scaleSetting === "200" ? "selected" : ""}>200%</option>
        <option value="400" ${scaleSetting === "400" ? "selected" : ""}>400%</option>
      </select>
      <span class="scale-label" id="scalePct">100%</span>`;
}

function renderMainViewport() {
  const root = qs("#content");
  root.innerHTML = `<section class="panel">
    <div class="panel-h">
      <div class="row-space">
        <div class="selector-lines">
          <div class="selector-row">
            <select id="testSelect"></select>
            <div class="btn-group">
              <button class="btn btn-icon" type="button" id="prevTestBtn" title="Previous Suite" aria-label="Previous Suite">&#x2039;</button>
              <button class="btn btn-icon" type="button" id="nextTestBtn" title="Next Suite" aria-label="Next Suite">&#x203A;</button>
            </div>
          </div>
          <div class="selector-row">
            <select id="caseSelect"></select>
            <div class="btn-group">
              <button class="btn btn-icon" type="button" id="prevCaseBtn" title="Previous Case" aria-label="Previous Case">&#x2039;</button>
              <button class="btn btn-icon" type="button" id="nextCaseBtn" title="Next Case" aria-label="Next Case">&#x203A;</button>
            </div>
          </div>
        </div>
        <div class="controls-col">
          <div class="verifier-row btn-group-wrap" id="verifierButtons"></div>
          <div class="viewmode-row btn-group-wrap" id="viewModeButtons"></div>
        </div>
      </div>
      <div class="meta-toggle-row">
        <div id="testMetaSummary" class="meta"></div>
      </div>
      <details id="testTextExpander" class="text-expander">
        <summary>
          <div class="text-expander-head">
            <div id="testTextPreview" class="text-expander-preview"></div>
            <div class="text-expander-arrow">▸</div>
          </div>
        </summary>
        <div id="testTextBody" class="text-expander-body"></div>
      </details>
    </div>
    <article class="case" id="casePanel"></article>
  </section>`;

  const testSel = qs("#testSelect");
  for (const t of data.tests) {
    const opt = document.createElement("option");
    opt.value = t.name;
    opt.textContent = `${t.name} (${t.cases.length})`;
    testSel.appendChild(opt);
  }
  if (!findTestByName(appState.testName) && data.tests.length) {
    appState.testName = data.tests[0].name;
  }
  testSel.value = appState.testName;

  const applySelection = () => {
    const test = selectedTest();
    if (!test) return;
    appState.testName = test.name;
    testSel.value = test.name;
    renderCaseSelector(test);
    const caseSel = qs("#caseSelect");
    const existing = Array.from(caseSel.options).find((o) => o.value === appState.caseName);
    caseSel.value = existing ? existing.value : (caseSel.options[0]?.value || "");
    appState.caseName = caseSel.value;
    renderSelectedCase();
    syncStateToHash();
  };

  const renderSelectedCase = () => {
    const test = selectedTest();
    if (!test) return;
    const metaText = `${test.cases.length} case(s), ${test.failed} failed, ${test.passed} passed, ${Math.round(test.secs)}s`;
    qs("#testMetaSummary").textContent = metaText;
    const descText = test.desc || "";
    const descLines = descText
      .split(/\r?\n/)
      .map((line) => line.trim())
      .filter((line) => line.length > 0);
    const firstLine = descLines[0] || "(no description)";
    const remainingText = descLines.slice(1).join("\n");
    qs("#testTextPreview").textContent = firstLine;
    qs("#testTextBody").textContent = remainingText || "(no additional details)";
    const expander = qs("#testTextExpander");
    expander.open = false;
    const c = selectedCase(test);
    if (!c) return;
    appState.caseName = c.name;
    const caseSel = qs("#caseSelect");
    if (caseSel) caseSel.value = c.name;
    const caseEl = qs("#casePanel");
    const prevVerifierName = appState.verifierName || qs("#verifierButtons .mode-btn.active")?.textContent?.trim() || "";
    const modes = c.verifier_modes || [];
    const preferredIndex = findPreferredVerifierIndex(modes, prevVerifierName);
    appState.modeIndex = Math.max(0, preferredIndex);
    caseEl.dataset.viewMode = appState.viewMode;
    caseEl.dataset.modeIndex = String(appState.modeIndex);
    caseEl.dataset.scaleSetting = appState.scaleSetting;
    const modeButtons = modes.map((m, i) => `<button class="btn mode-btn ${i===appState.modeIndex ? "active" : ""}" type="button" data-mode-index="${i}">${escapeHtml(m.verifier)}</button>`).join("");
    qs("#verifierButtons").innerHTML = modeButtons;
    qs("#viewModeButtons").innerHTML = buildViewModeControls(appState.viewMode, appState.scaleSetting);
    caseEl.innerHTML = `
      <div class="row">
        <h3>${escapeHtml(c.name)}</h3>
        <span class="badge ${c.outcome === "passed" ? "ok" : "bad"}">${escapeHtml(c.outcome.toUpperCase())}</span>
        <span class="badge">${Math.round(c.secs)}s</span>
      </div>
      ${c.case_msg ? `<div class="msg">${escapeHtml(c.case_msg)}</div>` : ""}
      <div class="mode-content"></div>`;
    caseEl.dataset.verifierModes = JSON.stringify(modes);
    bindModeButtons();
    syncStateToHash();
  };

  testSel.addEventListener("change", () => {
    appState.testName = testSel.value;
    applySelection();
  });
  qs("#caseSelect").addEventListener("change", () => {
    appState.caseName = qs("#caseSelect").value;
    renderSelectedCase();
  });
  applySelection();
}

async function renderMode(caseEl, modeIndex) {
  const renderToken = String(Number(caseEl.dataset.renderToken || "0") + 1);
  caseEl.dataset.renderToken = renderToken;
  const modes = JSON.parse(caseEl.dataset.verifierModes || "[]");
  if (!modes.length) return;
  const m = modes[Math.max(0, Math.min(modeIndex, modes.length - 1))];
  const viewMode = caseEl.dataset.viewMode || appState.viewMode || "compare";
  appState.modeIndex = Math.max(0, Math.min(modeIndex, modes.length - 1));
  appState.verifierName = String(m.verifier || "");
  appState.viewMode = viewMode;
  const hasRawPfm = hasImg(m.raw_output_image) && hasImg(m.raw_ref_image);
  const outputBlock = hasImg(m.plot_output_image) ? `<img loading="lazy" src="${escapeAttr(m.plot_output_image)}" alt="output image" />` : "<div class='msg'>(no output image)</div>";
  const refBlock = hasImg(m.plot_ref_image) ? `<img loading="lazy" src="${escapeAttr(m.plot_ref_image)}" alt="reference image" />` : "<div class='msg'>(no reference image)</div>";
  const debugBlock = hasImg(m.plot_debug_image) ? `<img loading="lazy" src="${escapeAttr(m.plot_debug_image)}" alt="debug output image" />` : "<div class='msg'>(no debug output image)</div>";
  const plotCompareBlock = hasImg(m.plot_output_image) && hasImg(m.plot_ref_image) ? `
    <div class="compare">
      <div class="imglabel">Slider Compare (left: output, right: reference)</div>
      <div class="compare-stage">
        <img-comparison-slider value="50">
          <div slot="handle" class="compare-handle" aria-hidden="true"><span class="chev left"></span><span class="bar"></span><span class="chev right"></span></div>
          <img slot="first" class="compare-overlay-media" src="${escapeAttr(m.plot_output_image)}" alt="output image" />
          <img slot="second" class="compare-base-media" src="${escapeAttr(m.plot_ref_image)}" alt="reference image" />
        </img-comparison-slider>
      </div>
    </div>` : "";
  const rawCompareBlock = hasRawPfm ? `
    <div class="compare pfm-compare">
      <div class="imglabel">Slider Compare (left: output, right: reference)</div>
      <div class="compare-stage">
        <img-comparison-slider value="50">
          <div slot="handle" class="compare-handle" aria-hidden="true"><span class="chev left"></span><span class="bar"></span><span class="chev right"></span></div>
          <canvas slot="first" class="pfm-overlay"></canvas>
          <canvas slot="second" class="pfm-base"></canvas>
        </img-comparison-slider>
      </div>
    </div>` : "";
  const metrics = m.metrics && Object.keys(m.metrics).length ? `<div class="msg">Metrics: ${escapeHtml(JSON.stringify(m.metrics))}</div>` : "";
  const verifierMsg = m.message ? `<div class="msg">Verifier: ${escapeHtml(m.message)}</div>` : "";
  const debugMsg = m.debug_msg ? `<div class="msg">Debug: ${escapeHtml(m.debug_msg)}</div>` : "";
  const modeContent = qs(".mode-content", caseEl);
  let body = "";
  if (viewMode === "plot") {
    body = `
      <div class="images plot-grid">
        <div class="imgbox"><div class="imglabel">Output Plot</div><div class="imgframe">${outputBlock}</div></div>
        <div class="imgbox"><div class="imglabel">Reference Plot</div><div class="imgframe">${refBlock}</div></div>
        <div class="imgbox"><div class="imglabel">Debug Plot</div><div class="imgframe">${debugBlock}</div></div>
      </div>`;
  } else {
    body = rawCompareBlock || plotCompareBlock || "<div class='msg'>(compare view unavailable for this verifier)</div>";
  }
  if (caseEl.dataset.renderToken !== renderToken) return;
  modeContent.innerHTML = `${body}${metrics}${verifierMsg}${debugMsg}`;

  qsa("#verifierButtons .mode-btn").forEach((btn) => btn.classList.remove("active"));
  const activeBtn = qs(`#verifierButtons .mode-btn[data-mode-index="${appState.modeIndex}"]`);
  if (activeBtn) activeBtn.classList.add("active");
  qsa("#viewModeButtons .viewmode-btn").forEach((btn) => btn.classList.toggle("active", btn.dataset.viewmode === appState.viewMode));
  const scaleSelect = qs("#scaleSelect");
  if (scaleSelect) scaleSelect.value = caseEl.dataset.scaleSetting || appState.scaleSetting || "fit";
  if (viewMode !== "plot" && hasRawPfm) {
    const rawBlock = qs(".pfm-compare", modeContent);
    if (rawBlock) {
      const ok = await initPfmCompare(rawBlock, m.raw_output_image, m.raw_ref_image);
      if (caseEl.dataset.renderToken !== renderToken) return;
      if (!ok && String(window.location.protocol || "") === "file:" && plotCompareBlock) {
        modeContent.innerHTML = `${plotCompareBlock}${metrics}${verifierMsg}${debugMsg}`;
      }
    }
  }
  applyScaleForCurrentMode(caseEl, modeContent, viewMode);

  if ((caseEl.dataset.scaleSetting || "fit") === "fit") {
    requestAnimationFrame(() => {
      if (caseEl.dataset.renderToken !== renderToken) return;
      applyScaleForCurrentMode(caseEl, modeContent, caseEl.dataset.viewMode || "compare");
    });
    qsa("img", modeContent).forEach((imgEl) => {
      if (imgEl.complete && imgEl.naturalWidth > 0 && imgEl.naturalHeight > 0) return;
      imgEl.addEventListener("load", () => {
        if (caseEl.dataset.renderToken !== renderToken) return;
        applyScaleForCurrentMode(caseEl, modeContent, caseEl.dataset.viewMode || "compare");
      }, { once: true });
    });
  }
  syncStateToHash();
}

function bindModeButtons() {
  qsa("#casePanel").forEach((caseEl) => {
    const buttons = qsa("#verifierButtons .mode-btn");
    buttons.forEach((btn) => {
      btn.addEventListener("click", () => {
        appState.modeIndex = Number(btn.dataset.modeIndex);
        caseEl.dataset.modeIndex = String(appState.modeIndex);
        renderMode(caseEl, appState.modeIndex);
      });
    });
    qsa("#viewModeButtons .viewmode-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        appState.viewMode = btn.dataset.viewmode;
        caseEl.dataset.viewMode = appState.viewMode;
        renderMode(caseEl, appState.modeIndex);
      });
    });
    const scaleSelect = qs("#scaleSelect");
    if (scaleSelect) {
      scaleSelect.addEventListener("change", () => {
        appState.scaleSetting = scaleSelect.value;
        caseEl.dataset.scaleSetting = appState.scaleSetting;
        const modeContent = qs(".mode-content", caseEl);
        if (modeContent) {
          applyScaleForCurrentMode(caseEl, modeContent, caseEl.dataset.viewMode || appState.viewMode);
        }
        syncStateToHash();
      });
    }
    if (buttons.length) {
      renderMode(caseEl, appState.modeIndex);
    }
  });
}

function stepCase(delta) {
  const testSelect = qs("#testSelect");
  const caseSelect = qs("#caseSelect");
  if (!testSelect || !caseSelect || !testSelect.options.length) return;

  const testOptions = Array.from(testSelect.options);
  const testIndex = Math.max(0, testOptions.findIndex((opt) => opt.value === testSelect.value));
  const caseOptions = Array.from(caseSelect.options);
  if (!caseOptions.length) return;

  let caseIndex = Math.max(0, caseOptions.findIndex((opt) => opt.value === caseSelect.value));
  caseIndex += delta;

  const moveToTest = (targetIndex, pickLastCase) => {
    testSelect.value = testOptions[targetIndex].value;
    testSelect.dispatchEvent(new Event("change"));
    const refreshedCaseSelect = qs("#caseSelect");
    if (!refreshedCaseSelect || !refreshedCaseSelect.options.length) return;
    refreshedCaseSelect.value = pickLastCase
      ? refreshedCaseSelect.options[refreshedCaseSelect.options.length - 1].value
      : refreshedCaseSelect.options[0].value;
    refreshedCaseSelect.dispatchEvent(new Event("change"));
  };

  if (caseIndex >= 0 && caseIndex < caseOptions.length) {
    caseSelect.value = caseOptions[caseIndex].value;
    caseSelect.dispatchEvent(new Event("change"));
    return;
  }

  if (delta < 0) {
    const prevTest = testIndex > 0 ? testIndex - 1 : testOptions.length - 1;
    moveToTest(prevTest, true);
  } else {
    const nextTest = testIndex + 1 < testOptions.length ? testIndex + 1 : 0;
    moveToTest(nextTest, false);
  }
}

function stepTest(delta) {
  const testSelect = qs("#testSelect");
  if (!testSelect || !testSelect.options.length) return;
  const options = Array.from(testSelect.options);
  let idx = options.findIndex((opt) => opt.value === testSelect.value);
  if (idx < 0) idx = 0;
  idx = (idx + delta + options.length) % options.length;
  testSelect.value = options[idx].value;
  testSelect.dispatchEvent(new Event("change"));
}

function applyFilter() {
  const text = qs("#search").value.trim().toLowerCase();
  const outcomeFilter = qs("#filter").value;
  appState.searchText = text;
  appState.outcomeFilter = outcomeFilter;
  const list = qs("#testList");
  list.innerHTML = "";
  let visibleSuites = 0;
  let visibleCases = 0;

  const sortedTests = data.tests.slice().sort((a, b) => b.failed - a.failed);
  for (const test of sortedTests) {
    const testName = test.name.toLowerCase();
    const matchingCases = test.cases.filter((c) => {
      const matchText = testName.includes(text) || c.name.toLowerCase().includes(text);
      return matchText && (outcomeFilter === "all" || c.outcome === outcomeFilter);
    });

    if (matchingCases.length > 0) {
      visibleSuites += 1;
      visibleCases += matchingCases.length;
      const item = document.createElement("button");
      item.type = "button";
      item.className = "item";
      const name = document.createElement("div");
      name.className = "name";
      name.textContent = test.name;
      const tiny = document.createElement("div");
      tiny.className = "tiny";
      tiny.textContent = `${matchingCases.length} visible case(s)`;
      item.appendChild(name);
      item.appendChild(tiny);
      item.addEventListener("click", () => {
        const testSelect = qs("#testSelect");
        testSelect.value = test.name;
        testSelect.dispatchEvent(new Event("change"));
        const caseSelect = qs("#caseSelect");
        const preferred = matchingCases[0]?.name;
        const options = Array.from(caseSelect.options);
        const hasPreferred = options.find((o) => o.value === preferred);
        if (hasPreferred) caseSelect.value = preferred;
        caseSelect.dispatchEvent(new Event("change"));
      });
      list.appendChild(item);
    }
  }
  qs("#listSummary").textContent = `${visibleSuites} suite(s), ${visibleCases} case(s) shown`;
  syncStateToHash();
}

function installKeyboardShortcuts() {
  document.addEventListener("keydown", (evt) => {
    const target = evt.target;
    const tag = target && target.tagName ? target.tagName.toLowerCase() : "";
    const inEditor = tag === "input" || tag === "textarea" || tag === "select" || (target && target.isContentEditable);
    if (inEditor) return;
    if (evt.key === "/") {
      evt.preventDefault();
      const search = qs("#search");
      if (search) {
        search.focus();
        search.select();
      }
      return;
    }
    if (evt.key === "j") {
      evt.preventDefault();
      stepCase(1);
    } else if (evt.key === "k") {
      evt.preventDefault();
      stepCase(-1);
    } else if (evt.key === "J") {
      evt.preventDefault();
      stepTest(1);
    } else if (evt.key === "K") {
      evt.preventDefault();
      stepTest(-1);
    } else if (evt.key.toLowerCase() === "f") {
      evt.preventDefault();
      const filter = qs("#filter");
      if (!filter) return;
      filter.value = filter.value === "failed" ? "all" : "failed";
      filter.dispatchEvent(new Event("change"));
    }
  });
}

readStateFromHash();
renderSummary();
renderMainViewport();
qs("#search").value = appState.searchText;
qs("#filter").value = appState.outcomeFilter;
qs("#search").addEventListener("input", applyFilter);
qs("#filter").addEventListener("change", applyFilter);
qs("#prevTestBtn").addEventListener("click", () => stepTest(-1));
qs("#nextTestBtn").addEventListener("click", () => stepTest(1));
qs("#prevCaseBtn").addEventListener("click", () => stepCase(-1));
qs("#nextCaseBtn").addEventListener("click", () => stepCase(1));
window.addEventListener("resize", () => {
  clearTimeout(fitResizeTimer);
  fitResizeTimer = window.setTimeout(() => {
    const caseEl = qs("#casePanel");
    if (!caseEl) return;
    if ((caseEl.dataset.scaleSetting || appState.scaleSetting || "fit") !== "fit") return;
    const modeContent = qs(".mode-content", caseEl);
    if (!modeContent) return;
    applyScaleForCurrentMode(caseEl, modeContent, caseEl.dataset.viewMode || appState.viewMode);
  }, 140);
});
qs("#toggleWarningsBtn").addEventListener("click", () => {
  const block = qs("#warnInfo");
  block.classList.toggle("show");
  appState.warningsOpen = block.classList.contains("show");
  updateWarningsButtonText();
});
if (appState.warningsOpen) {
  const block = qs("#warnInfo");
  block.classList.add("show");
  updateWarningsButtonText();
}
applyFilter();
installKeyboardShortcuts();
</script>
